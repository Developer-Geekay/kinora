[package]
name = "localtube-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
if-addrs = "0.15.0"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
