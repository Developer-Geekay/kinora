        <div class="errorbox" role="alert">
          <strong>That didn't play</strong>
          <span id="errMsg"></span>
          <div class="row" style="gap:8px"><button class="btn filled has-icon" id="retry"><svg class="i"><use href="#i-retry"/></svg>Try again</button><button class="btn tonal" id="errNext">Skip</button></div>
        </div>

        <div class="chrome" id="chrome">
          <div class="ctop">
            <button class="cb" data-c="close" aria-label="Close player (Esc)" title="Close (Esc)" hidden><svg class="i"><use href="#i-back"/></svg></button>
            <div class="ctitle"><strong data-c="title"></strong><span data-c="sub"></span></div>
            <div class="cend" data-c="topend"></div>
          </div>
          <div class="cmid">
            <button class="mb" data-c="midprev" id="midPrev" aria-label="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
            <button class="mb big" data-c="midpp" id="midPP" aria-label="Play / pause"><svg class="i"><use href="#i-play"/></svg></button>
            <button class="mb" data-c="midnext" id="midNext" aria-label="Next"><svg class="i"><use href="#i-next"/></svg></button>
          </div>
          <div class="controls" id="controls">
            <div class="seek" data-c="seekwrap" id="seekWrap">
              <div class="track"></div><div class="knob"></div><div class="tip" data-c="tip" id="tip">0:00</div>
              <input data-c="seek" id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Seek">
            </div>
            <div class="row">
              <button class="cb wide" data-c="prev" id="prevBtn" aria-label="Previous (P)" title="Previous (P)"><svg class="i"><use href="#i-prev"/></svg></button>
              <button class="cb wide" data-c="pp" id="pp" aria-label="Play / pause (space)"><svg class="i" id="ppi"><use href="#i-play"/></svg></button>
              <button class="cb wide" data-c="next" id="nextBtn" aria-label="Next (N)" title="Next (N)"><svg class="i"><use href="#i-next"/></svg></button>
              <span class="vol"><button class="cb" data-c="mute" id="mute" aria-label="Mute (M)" title="Mute (M)"><svg class="i" id="vi"><use href="#i-vol"/></svg></button><input data-c="vol" id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></span>
              <span class="time" data-c="time" id="time">0:00 / 0:00</span>
              <span class="grow"></span>
              <span class="cright"><button class="cb" data-c="cc" id="ccBtn" aria-label="Captions (C)" aria-pressed="false" title="Captions (C)"><svg class="i"><use href="#i-cc"/></svg></button><button class="cb gear" data-c="gear" id="gear" aria-label="Settings" title="Settings"><svg class="i"><use href="#i-settings"/></svg></button></span>
              <button class="cb" data-c="list" aria-label="Files in this folder" title="Files in this folder" hidden><svg class="i"><use href="#i-queue"/></svg></button>
              <button class="cb wide" data-c="theater" id="thBtn" aria-label="Theater mode (T)" title="Theater mode (T)"><svg class="i" id="thi"><use href="#i-theater"/></svg></button>
              <button class="cb" data-c="fs" id="fs" aria-label="Full screen (F)" title="Full screen (F)"><svg class="i"><use href="#i-full"/></svg></button>
            </div>
          </div>
        </div>

        <div class="minibar" id="minibar">
          <span class="mtitle" id="miniTitle"></span>
          <button class="cb" id="miniPP" aria-label="Play / pause"><svg class="i" id="miniPPi"><use href="#i-play"/></svg></button>
          <button class="cb" id="miniExpand" aria-label="Back to the video"><svg class="i"><use href="#i-expand"/></svg></button>
          <button class="cb" id="miniClose" aria-label="Close player"><svg class="i"><use href="#i-close"/></svg></button>
        </div>
      </div>
    </div>

    <div class="meta" id="meta" hidden>
      <div><h1 id="title"></h1></div>
      <div class="by" id="by"></div>
      <div class="actions">
        <button class="chip dot" id="modeChip"><svg class="i"><use href="#i-video"/></svg><span id="modeChipText"></span></button>
        <button class="btn tonal has-icon sm" id="saveBtn"><svg class="i"><use href="#i-pladd"/></svg>Save</button>
        <button class="btn tonal has-icon sm" id="queueAddBtn"><svg class="i"><use href="#i-queue"/></svg>Add to queue</button>
      </div>
      <div class="desc empty-desc" id="desc"><div class="stats" id="stats"></div><div class="text" id="descText"></div><button id="descToggle">Show more</button></div>
    </div>

    <aside id="side" aria-label="Playing queue" hidden>
      <div class="shead" id="shead"></div>
      <div class="list" id="sidelist"></div>
    </aside>
  </section>

  <section id="page" class="page"></section>
</main>

<div class="pop" id="pop" hidden></div>
<dialog id="dlg"></dialog>
<div class="snack" id="toast" role="status"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script src="app.js"></script>
</body>
</html>
